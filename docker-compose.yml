services:
  redis:
    image: redis:7-alpine
    container_name: dcs-redis
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
        POSTGRES_USER: myuser
        POSTGRES_PASSWORD: password
        POSTGRES_DB: mydatabase
    ports:
        - "5432:5432"
    volumes:
        - postgres_data:/var/lib/postgresql/data
volumes:
    postgres_data:
